name: Python checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - python: "3.11"
            sklearn: "scikit-learn==1.8.*"
          - python: "3.12"
            sklearn: "scikit-learn>=1.8"
    env:
      MPLBACKEND: Agg
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: python/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r python/requirements.txt '${{ matrix.sklearn }}'
      - name: Run tests
        run: python -m pytest -q
